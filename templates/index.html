<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyttsx3 テキスト音声変換ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #4facfe;
        }

        .radio-option label {
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
        }

        .file-input-section, .text-input-section, .folder-input-section {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .file-input-section.active, .text-input-section.active, .folder-input-section.active {
            display: block;
        }

        .file-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .file-input-group input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .file-input-group input[type="text"]:focus {
            outline: none;
            border-color: #4facfe;
        }

        .file-input-group input[type="file"] {
            display: none;
        }

        .file-input-group label {
            background: #4facfe;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .file-input-group label:hover {
            background: #3a8bfe;
        }

        .text-area {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .text-area:focus {
            outline: none;
            border-color: #4facfe;
        }

        .folder-info {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .folder-info p {
            margin: 5px 0;
        }

        .output-section {
            margin-bottom: 30px;
        }

        .output-section h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }

        .output-section input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .output-section input[type="text"]:focus {
            outline: none;
            border-color: #4facfe;
        }

        .speed-options {
            margin-bottom: 30px;
        }

        .speed-options h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }

        .speed-radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .speed-radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #e1e5e9;
            transition: all 0.3s;
        }

        .speed-radio-option:hover {
            border-color: #4facfe;
        }

        .speed-radio-option input[type="radio"] {
            display: none;
        }

        .speed-radio-option label {
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            color: #333;
        }

        .speed-radio-option input[type="radio"]:checked + label {
            color: #4facfe;
        }

        .speed-radio-option.checked {
            border-color: #4facfe;
            background: #eaf6ff;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: #28A745;
            color: white;
        }

        .btn-secondary:hover {
            background: #28A745;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .processed-text {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        /* 折りたたみ可能なテキスト表示のスタイル */
        .collapsible-text {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-top: 15px;
            overflow: hidden;
        }

        .collapsible-header {
            background: #e9ecef;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            color: #495057;
            transition: background-color 0.3s;
        }

        .collapsible-header:hover {
            background: #dee2e6;
        }

        .collapsible-header .toggle-icon {
            font-size: 1.2em;
            transition: transform 0.3s;
        }

        .collapsible-header.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .collapsible-content.expanded {
            max-height: 500px;
            transition: max-height 0.3s ease-in;
        }

        .collapsible-text-content {
            padding: 15px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border-top: 1px solid #e9ecef;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* スクロールバーのスタイル */
        .collapsible-text-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .collapsible-text-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .collapsible-text-content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .collapsible-text-content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>pyttsx3 音声変換ツール</h1>
            <p>テキストを音声に変換してダウンロード</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <h3>入力方法を選択</h3>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="radio-file" name="input-type" value="file" checked>
                        <label for="radio-file">テキストファイルを使用</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="radio-text" name="input-type" value="text">
                        <label for="radio-text">テキストエリアに直接入力</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="radio-folder" name="input-type" value="folder">
                        <label for="radio-folder">フォルダから入力</label>
                    </div>
                </div>
                
                <div class="file-input-section active" id="file-section">
                    <div class="file-input-group">
                        <input type="text" id="filename-display" placeholder="ファイルを選択してください" readonly>
                        <input type="file" id="file-upload" accept=".txt,.md">
                        <label for="file-upload">ファイルを選択</label>
                    </div>
                    <button class="btn btn-primary" onclick="convertFile()">ファイルから変換開始</button>
                </div>
                
                <div class="text-input-section" id="text-section">
                    <textarea class="text-area" id="text-input" placeholder="ここにテキストを入力してください..."></textarea>
                    <div style="margin-top: 15px;">
                        <button class="btn btn-primary" onclick="convertText()">テキストから変換開始</button>
                    </div>
                </div>
                
                <div class="folder-input-section" id="folder-section">
                    <div class="folder-info">
                        <p><strong>入力フォルダ:</strong> input/</p>
                        <p><strong>出力フォルダ:</strong> output/</p>
                        <p style="color: #666; font-size: 0.9em;">※ inputフォルダ内のtxtファイルを1ファイルずつ処理します</p>
                    </div>
                    <div style="margin-top: 15px;">
                        <button class="btn btn-primary" onclick="convertFolder()">フォルダから変換開始</button>
                    </div>
                </div>
            </div>

            
            <div class="speed-options">
                <h3>読み上げ速度</h3>
                <div class="speed-radio-group">
                    <div class="speed-radio-option">
                        <input type="radio" id="rate-default" name="rate" value="200" checked>
                        <label for="rate-default">デフォルト</label>
                    </div>
                    <div class="speed-radio-option">
                        <input type="radio" id="rate-slow1" name="rate" value="170">
                        <label for="rate-slow1">すこしゆっくり</label>
                    </div>
                    <div class="speed-radio-option">
                        <input type="radio" id="rate-slow2" name="rate" value="140">
                        <label for="rate-slow2">ゆっくり</label>
                    </div>
                    <div class="speed-radio-option">
                        <input type="radio" id="rate-slow3" name="rate" value="100">
                        <label for="rate-slow3">かなりゆっくり</label>
                    </div>
                </div>
            </div>
            
            
            <div class="output-section" id="output-section">
                <h3>出力ファイル名（.wav）</h3>
                <input type="text" id="outputFilename" value="output.wav">
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>音声ファイルを生成中...</p>
            </div>
            
            <div class="result-section" id="result"></div>
        </div>
    </div>

    <script>
        // ラジオボタンの切り替え
        document.querySelectorAll('input[name="input-type"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const fileSection = document.getElementById('file-section');
                const textSection = document.getElementById('text-section');
                const folderSection = document.getElementById('folder-section');
                const outputSection = document.getElementById('output-section');
                
                // すべてのセクションを非アクティブにする
                fileSection.classList.remove('active');
                textSection.classList.remove('active');
                folderSection.classList.remove('active');
                
                // 出力ファイル名セクションを表示
                outputSection.style.display = 'block';
                
                // 選択されたセクションをアクティブにする
                if (this.value === 'file') {
                    fileSection.classList.add('active');
                } else if (this.value === 'text') {
                    textSection.classList.add('active');
                } else if (this.value === 'folder') {
                    folderSection.classList.add('active');
                    // フォルダから入力の場合は出力ファイル名を非表示
                    outputSection.style.display = 'none';
                }
            });
        });

        // ファイル選択時の処理
        document.getElementById('file-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('filename-display').value = file.name;
            }
        });

        // ファイルから変換
        async function convertFile() {
            const fileInput = document.getElementById('file-upload');
            const outputFilename = document.getElementById('outputFilename').value;
            
            if (!fileInput.files[0]) {
                showError('ファイルを選択してください');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('inputType', 'file');
            formData.append('outputFilename', outputFilename);
            
            // 読み上げ速度を追加
            const selectedRate = document.querySelector('input[name="rate"]:checked').value;
            formData.append('rate', selectedRate);
            
            await convertTextToSpeech(formData);
        }

        // テキストから変換
        async function convertText() {
            const textInput = document.getElementById('text-input').value.trim();
            const outputFilename = document.getElementById('outputFilename').value;
            
            if (!textInput) {
                showError('テキストを入力してください');
                return;
            }
            
            const formData = new FormData();
            formData.append('text', textInput);
            formData.append('inputType', 'text');
            formData.append('outputFilename', outputFilename);
            
            // 読み上げ速度を追加
            const selectedRate = document.querySelector('input[name="rate"]:checked').value;
            formData.append('rate', selectedRate);
            
            await convertTextToSpeech(formData);
        }

        // フォルダから変換
        async function convertFolder() {
            const formData = new FormData();
            formData.append('inputType', 'folder');
            
            // 読み上げ速度を追加
            const selectedRate = document.querySelector('input[name="rate"]:checked').value;
            formData.append('rate', selectedRate);
            
            await convertTextToSpeech(formData);
        }

        // 音声変換処理
        async function convertTextToSpeech(formData) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            try {
                loading.style.display = 'block';
                result.style.display = 'none';
                
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.input_type === 'folder') {
                        showSuccess(data.message, null, null, data.total_conversion_time, data.processed_files);
                    } else {
                        showSuccess(data.message, data.processed_text, data.filename, data.conversion_time);
                    }
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('通信エラーが発生しました: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // 成功メッセージ表示
        function showSuccess(message, processedText, filename, conversionTime, processedFiles) {
            const result = document.getElementById('result');
            result.className = 'result-section result-success';
            result.style.display = 'block';
            
            let html = `<h4>✅ ${message}`;
            if (conversionTime) {
                html += `（変換秒数：${conversionTime}秒）`;
            }
            html += `</h4>`;
            
            if (processedText) {
                html += `
                    <div class="collapsible-text">
                        <div class="collapsible-header collapsed" onclick="toggleCollapsible(this)">
                            <span>変換後のテキストを表示</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="collapsible-content">
                            <div class="collapsible-text-content">${processedText}</div>
                        </div>
                    </div>
                `;
            }
            
            if (processedFiles) {
                // フォルダ処理の結果表示
                html += `<div style="margin-top: 15px;"><h5>処理結果:</h5>`;
                html += `<div style="max-height: 300px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; padding: 10px; background: #f8f9fa;">`;
                
                processedFiles.forEach(file => {
                    if (file.status === 'success') {
                        html += `<div style="margin: 5px 0; padding: 5px; background: #d4edda; border-radius: 4px;">`;
                        html += `✅ ${file.filename} → ${file.output_filename} (${file.conversion_time}秒)`;
                        html += `</div>`;
                    } else {
                        html += `<div style="margin: 5px 0; padding: 5px; background: #f8d7da; border-radius: 4px;">`;
                        html += `❌ ${file.filename}: ${file.message}`;
                        html += `</div>`;
                    }
                });
                
                html += `</div>`;
                html += `<div style="margin-top: 15px;"><p style="color: #666;">音声ファイルは "output" フォルダに保存されました。</p></div>`;
            } else if (filename) {
                html += `<div style="margin-top: 15px;"><a href="/download/${filename}" class="btn btn-secondary">音声ファイルをダウンロード</a></div>`;
            }
            
            result.innerHTML = html;
        }

        // エラーメッセージ表示
        function showError(message) {
            const result = document.getElementById('result');
            result.className = 'result-section result-error';
            result.style.display = 'block';
            result.innerHTML = `<h4>❌ エラー</h4><p>${message}</p>`;
        }

        // 折りたたみ機能の制御
        function toggleCollapsible(header) {
            const content = header.nextElementSibling;
            const isCollapsed = header.classList.contains('collapsed');
            
            if (isCollapsed) {
                // 展開
                header.classList.remove('collapsed');
                content.classList.add('expanded');
                header.querySelector('span:first-child').textContent = '変換後のテキストを隠す';
            } else {
                // 折りたたみ
                header.classList.add('collapsed');
                content.classList.remove('expanded');
                header.querySelector('span:first-child').textContent = '変換後のテキストを表示';
            }
        }

        // ラジオボタンの選択状態に応じてスタイルを更新
        document.querySelectorAll('.speed-radio-option').forEach(option => {
            const radio = option.querySelector('input[type="radio"]');
            radio.addEventListener('change', () => {
                document.querySelectorAll('.speed-radio-option').forEach(o => o.classList.remove('checked'));
                if (radio.checked) {
                    option.classList.add('checked');
                }
            });
            // 初期状態でチェックされているものにスタイルを適用
            if (radio.checked) {
                option.classList.add('checked');
            }
        });
    </script>
</body>
</html>
